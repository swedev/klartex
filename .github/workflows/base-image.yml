name: Build and publish base image

# The render environment klartex is developed against — TeX Live,
# mscorefonts, the Python runtime — lives in docker/Dockerfile.base and is
# published here as ghcr.io/swedev/klartex-base. Consumers, such as
# swedev/klartex.se's backend image, pin a tag + manifest digest from this
# registry and build their venv and app on top.
#
# The full klartex test suite runs inside the freshly built amd64 image
# before anything is pushed, so an image klartex cannot render in never
# reaches the registry. The arm64 manifest gets the Dockerfile's
# build-time sanity check only.
#
# Runs only when the base file (or this workflow) changes — a few times a
# year. The ~15-20 minute QEMU arm64 build is the price of that run, and
# is why no GHA cache is configured: ~7 GB per architecture never fits in
# the 10 GB repo cache anyway.
#
# Bumping the base: change docker/Dockerfile.base, merge, wait for the tag
# this workflow publishes, then open a separate PR in each consumer that
# moves its pin to the new tag + digest. Published tags referenced by any
# Dockerfile or workflow in the history must never be deleted.

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.base'
      - '.github/workflows/base-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker/Dockerfile.base'
      - '.github/workflows/base-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag. Defaults to <YYYYMMDD>-<run number>.'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build, test and push base image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # No `latest`: nothing should ever point at a moving reference, so
      # it does not exist to point at. The run number keeps the tag unique
      # when the base is rebuilt twice on the same day; true immutability
      # comes from the digest the consumer pins.
      #
      # The dispatch input reaches the script through env, never through
      # ${{ }}: interpolation happens before bash parses the line, so a
      # crafted tag would run as commands in a job holding packages:write.
      # It is validated against the Docker tag grammar for the same reason.
      - name: Resolve tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(date -u +%Y%m%d)-${RUN_NUMBER}"
          fi
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "invalid image tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # TeX Live needs the room: the self-test image is unpacked into the
      # Docker store (~7 GB) while BuildKit separately keeps the layers it
      # was built from, and the multi-arch build then adds arm64 on top.
      # A standard runner does not have that much free, but ~25 GB of it
      # is preinstalled toolchains this job never touches.
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolved once and passed to both builds below: the image the suite
      # runs in and the image that is pushed are then provably built from
      # the same upstream snapshot, however long the arm64 build takes.
      - name: Resolve upstream TeX Live digest
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect texlive/texlive:latest \
            --format '{{.Manifest.Digest}}')"
          echo "ref=texlive/texlive:latest@${digest}" >> "$GITHUB_OUTPUT"
          echo "Upstream: texlive/texlive:latest@${digest}"

      - name: Build amd64 image for self-test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          platforms: linux/amd64
          push: false
          load: true
          tags: klartex-base:selftest
          build-args: |
            TEXLIVE_REF=${{ steps.upstream.outputs.ref }}

      # The point of the whole workflow: klartex must pass inside the image
      # before the image can be published. poppler-utils is installed here
      # rather than baked in — the image stays production-faithful and the
      # pdftotext round-trip tests still run. KLARTEX_REQUIRE_GEORGIA turns
      # the Georgia render test's skip into a failure, so a base that lost
      # the fonts fails here instead of shipping.
      - name: Run klartex test suite inside the image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work \
            -e KLARTEX_REQUIRE_GEORGIA=1 \
            klartex-base:selftest bash -c '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends poppler-utils
              python3 -m venv /tmp/venv
              /tmp/venv/bin/pip install ".[dev]"
              export PATH=/usr/local/texlive-bin:$PATH
              /tmp/venv/bin/pytest -v -rs --tb=short 2>&1 | tee /tmp/test-output.txt
              ! grep -q "SKIPPED.*xelatex" /tmp/test-output.txt'

      # The unpacked copy in the Docker store is dead weight once the suite
      # has passed. BuildKit still holds the layers, so the push build
      # below reuses them instead of rebuilding amd64.
      - name: Reclaim self-test image
        shell: bash
        run: |
          set -euo pipefail
          docker rmi klartex-base:selftest
          df -h /

      - name: Build and push multi-arch image
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/swedev/klartex-base:${{ steps.meta.outputs.tag }}
          build-args: |
            TEXLIVE_REF=${{ steps.upstream.outputs.ref }}

      # The digest is what consumer Dockerfiles pin, so print it where the
      # follow-up PR can copy it from.
      - name: Report pin
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "Pin this in the consumers that build on this image:"
            echo
            echo '```'
            echo "ghcr.io/swedev/klartex-base:${TAG}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
