# Faktura (Invoice) — recipe definition

template:
  name: faktura
  description: "Faktura / Invoice"
  lang: sv

document:
  title: "Faktura {{ data.invoice_number }}"
  # The seller's own details are already in the payload, so the footer is
  # derived from them; the payload's own page_template.footer wins per field.
  page_template:
    # The recipe's default text-block geometry; the payload's own
    # page_template.margins wins per key.
    margins:
      left: 2cm
      right: 2cm
      top: 1.7cm
    footer:
      variant: columns
      fields_from:
        company: sender.name
        address: [sender.address_line1, sender.address_line2]
        org_number: sender.org_number
        bankgiro: bankgiro
        plusgiro: plusgiro
        iban: iban
        bic: bic
  label_missing_footer_fields: true

components:
  - type: invoice_header
    data_map:
      invoice_number: invoice_number
      date: date
      due_date: due_date
      sender_name: sender.name
      logo: logo
      logo_height: logo_height
      logo_offset: logo_offset

  - type: invoice_recipient
    data_map:
      sender: sender
      recipient: recipient
      reference: reference
      our_reference: our_reference
      payment_terms: payment_terms

  - type: invoice_table
    data_map:
      lines: lines
      currency: currency

  - type: payment_info
    data_map:
      bankgiro: bankgiro
      plusgiro: plusgiro
      iban: iban
      bic: bic

  - type: invoice_note
    data_map:
      note: note

schema: schema.json
