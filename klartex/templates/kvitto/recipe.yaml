# Kvitto (Receipt) — recipe definition

template:
  name: kvitto
  description: "Kvitto / Receipt"
  lang: sv

document:
  title: "Kvitto {{ data.receipt_number }}"
  # The issuer's own details are already in the payload, so the footer is
  # derived from them; the payload's own page_template.footer wins per field.
  page_template:
    # The recipe's default text-block geometry; the payload's own
    # page_template.margins wins per key.
    margins:
      left: 2cm
      right: 2cm
      top: 1.7cm
    footer:
      variant: columns
      fields_from:
        company: sender.name
        address: [sender.address_line1, sender.address_line2]
        org_number: sender.org_number
  label_missing_footer_fields: true
  metadata:
    - field: payment_method
      label: "Betalsätt"
      optional: true
    - field: paid_by
      label: "Betalt av"
      optional: true

components:
  - type: receipt_header
    data_map:
      receipt_number: receipt_number
      date: date
      sender_name: sender.name
      logo: logo
      logo_height: logo_height
      logo_offset: logo_offset

  - type: invoice_recipient
    data_map:
      sender: sender

  - type: receipt_table
    data_map:
      items: items
      total_amount: total_amount
      currency: currency

  - type: description_list

  - type: invoice_note
    data_map:
      note: note

schema: schema.json
