# Faktura (Invoice) — recipe definition

template:
  name: faktura
  description: "Faktura / Invoice"
  lang: sv

document:
  class_options: invoice
  title: "Faktura {{ data.invoice_number }}"

components:
  - type: invoice_header
    data_map:
      invoice_number: invoice_number
      date: date
      due_date: due_date
      logo: logo
      logo_height: logo_height
      logo_offset: logo_offset

  - type: invoice_recipient
    data_map:
      sender: sender
      recipient: recipient
      reference: reference
      our_reference: our_reference
      payment_terms: payment_terms

  - type: invoice_table
    data_map:
      lines: lines
      currency: currency

  - type: payment_info
    data_map:
      bankgiro: bankgiro
      plusgiro: plusgiro
      iban: iban
      bic: bic

  - type: invoice_note
    data_map:
      note: note

schema: schema.json
