name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "agent-docs/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-fonts-recommended texlive-latex-extra \
            texlive-latex-recommended texlive-science texlive-plain-generic \
            poppler-utils

      - name: Install project
        run: pip install --break-system-packages .[dev]

      # shell: bash gives the step `-o pipefail`, without which the step
      # would report tee's exit status and a pytest failure could pass.
      - name: Run tests
        shell: bash
        run: |
          pytest -v -rs --tb=short -n auto 2>&1 | tee test-output.txt

      - name: Verify no xelatex skips
        run: |
          ! grep -q "SKIPPED.*xelatex" test-output.txt
