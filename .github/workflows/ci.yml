name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "agent-docs/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Minimal TeX Live from CTAN, cached under ~/texlive between runs.
      # Actions caches are branch-scoped: a pull request can read its own
      # branch's cache and main's, so texlive-cache.yml keeps main's warm.
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages

      # pdftotext for the text-layer round-trip tests.
      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      # The serve extra is not optional in CI: without it tests/test_server.py
      # would importorskip itself away and the skip guard below is what
      # notices.
      - name: Install project
        run: pip install --break-system-packages ".[dev,serve]"

      # shell: bash gives the step `-o pipefail`, without which the step
      # would report tee's exit status and a pytest failure could pass.
      - name: Run tests
        shell: bash
        run: |
          pytest -v -rs --tb=short -n auto 2>&1 | tee test-output.txt

      # A skipped render test hides a broken TeX install; a skipped server
      # test hides a missing serve extra. Neither may pass silently.
      - name: Verify no xelatex or server skips
        run: |
          ! grep -qE "SKIPPED.*(xelatex|test_server)" test-output.txt
